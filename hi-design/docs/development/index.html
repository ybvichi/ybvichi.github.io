<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Design - 开发文档</title>
    <style>
        :root {
            --color-primary: #3b82f6;
            --color-success: #10b981;
            --color-warning: #f59e0b;
            --color-danger: #ef4444;
            --color-text: #1f2937;
            --color-text-secondary: #6b7280;
            --color-border: #e5e7eb;
            --color-bg: #f3f4f6;
            --color-card: #ffffff;
            --color-code-bg: #1e293b;
            --color-get: #3b82f6;
            --color-post: #10b981;
            --font-mono: 'SF Mono', 'Fira Code', 'Courier New', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        .header {
            background: var(--color-card);
            border-bottom: 1px solid var(--color-border);
            padding: 16px 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            height: 60px;
        }

        .header-inner {
            max-width: 100%;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
        }

        .header-left:hover .header-logo {
            transform: scale(1.05);
        }

        .header-left:hover h1 {
            color: var(--color-primary);
        }

        .header-logo {
            width: 32px;
            height: 32px;
            background: var(--color-primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
            color: var(--color-text);
        }

        .header .version {
            display: inline-block;
            padding: 2px 10px;
            background: var(--color-primary);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            border-radius: 4px;
            vertical-align: middle;
        }

        /* Main Layout */
        .main {
            display: flex;
            height: calc(100vh - 60px);
            margin-top: 60px;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            flex-shrink: 0;
            background: var(--color-card);
            border-right: 1px solid var(--color-border);
            overflow-y: auto;
            padding: 16px 0;
        }

        .sidebar-section {
            margin-bottom: 8px;
        }

        .sidebar-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--color-text-secondary);
            margin-bottom: 4px;
            padding: 8px 16px 4px;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            font-size: 14px;
            color: var(--color-text);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
            border-left: 3px solid transparent;
        }

        .sidebar-item:hover {
            background: var(--color-bg);
            color: var(--color-primary);
        }

        .sidebar-item.active {
            background: #eff6ff;
            color: var(--color-primary);
            border-left-color: var(--color-primary);
            font-weight: 600;
        }

        .sidebar-item .icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .sidebar-item .label {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Content / iframe */
        .content {
            flex: 1;
            min-width: 0;
            background: var(--color-bg);
            position: relative;
        }

        .content iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            overflow: hidden;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="header-left" onclick="goHome()" title="回到首页">
                <div class="header-logo">OD</div>
                <h1>Open Design <span class="version">开发文档</span></h1>
            </div>
        </div>
    </header>

    <div class="main">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">API 文档</div>
                <button class="sidebar-item" data-target="f_share_to_stage.html" onclick="navigateTo(this)">
                    <span class="icon">📤</span>
                    <span class="label">分享设计到项目广场</span>
                </button>
                <button class="sidebar-item" data-target="f_share_to_user.html" onclick="navigateTo(this)">
                    <span class="icon">👤</span>
                    <span class="label">分享设计给单个用户</span>
                </button>
            </div>
        </nav>

        <!-- Content -->
        <div class="content" id="content-area">
            <iframe src="welcome.html" title="文档内容" id="content-frame"></iframe>
        </div>
    </div>

    <script>
        // 页面映射配置
        const pageMap = {
            'f_share_to_stage': 'f_share_to_stage.html',
            'f_share_to_user': 'f_share_to_user.html'
        };

        // 导航到指定页面
        function navigateTo(element) {
            const target = element.getAttribute('data-target');
            if (!target) return;

            // 更新侧边栏激活状态
            document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');

            // 加载 iframe
            loadPage(target);

            // 更新 URL hash
            const hashKey = Object.keys(pageMap).find(key => pageMap[key] === target);
            if (hashKey) {
                history.pushState(null, null, '#' + hashKey);
            }
        }

        // 加载页面到 iframe
        function loadPage(url) {
            const iframe = document.getElementById('content-frame');
            if (iframe) {
                iframe.src = url;
            }
        }

        // 回到首页
        function goHome() {
            // 清除侧边栏激活状态
            document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
            // 清除 hash
            history.pushState(null, null, window.location.pathname);
            // 加载欢迎页
            loadPage('welcome.html');
        }

        // 解析 URL hash 并加载对应页面
        function loadFromHash() {
            const hash = window.location.hash.slice(1); // 去掉 #
            if (!hash) return;

            const targetUrl = pageMap[hash];
            if (!targetUrl) return;

            // 找到对应的菜单项并激活
            const menuItem = document.querySelector(`.sidebar-item[data-target="${targetUrl}"]`);
            if (menuItem) {
                document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
                menuItem.classList.add('active');
            }

            // 加载页面
            loadPage(targetUrl);
        }

        // 页面加载时检查 hash
        document.addEventListener('DOMContentLoaded', function() {
            loadFromHash();
        });

        // 监听 hash 变化
        window.addEventListener('hashchange', function() {
            loadFromHash();
        });
    </script>
</body>
</html>
