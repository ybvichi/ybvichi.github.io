<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎</title>
    <style>
        :root {
            --color-primary: #3b82f6;
            --color-success: #10b981;
            --color-text: #1f2937;
            --color-text-secondary: #6b7280;
            --color-border: #e5e7eb;
            --color-bg: #f3f4f6;
            --color-card: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .welcome-container {
            text-align: center;
            padding: 40px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.3);
        }

        .logo span {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
        }

        .welcome-container h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--color-text);
            margin-bottom: 12px;
        }

        .welcome-container .subtitle {
            font-size: 16px;
            color: var(--color-text-secondary);
            margin-bottom: 40px;
        }

        .hint {
            margin-top: 40px;
            padding: 16px 24px;
            background: #eff6ff;
            border: 1px solid #dbeafe;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--color-primary);
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .welcome-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="logo">
            <span>OD</span>
        </div>
        <h1>Open Design 开发文档</h1>
        <p class="subtitle">API 接口文档、数据库设计、开发指南</p>

        <div class="hint">
            <span>👈</span>
            <span>请从左侧菜单选择要查看的文档</span>
        </div>
    </div>
</body>
</html>
